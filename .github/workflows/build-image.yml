name: Build docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione di Bitcoin Core da pacchettizzare (es. 29.4)'
        required: true
        default: '29.4'
      latest:
        description: 'Aggiorna anche il tag :latest'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Le major v4/v7 dichiarano runs.using: node24. Le precedenti dichiaravano
      # node20, che il runner segnala come deprecato a ogni esecuzione.
      # Da non "risolvere" con ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: quella
      # variabile riporta il runner a Node 20, cioe' al runtime deprecato.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Nessun actions/checkout: build-push-action usa il Git context remoto e
      # builda il Dockerfile committato sul branch. Aggiungendo il checkout
      # servirebbe anche "context: .".
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BITCOIN_VERSION=${{ inputs.version }}
          tags: |
            bota87/bitcoind:${{ inputs.version }}
            ${{ inputs.latest && 'bota87/bitcoind:latest' || '' }}
